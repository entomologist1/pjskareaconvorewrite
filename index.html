<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my website</title>
  <!-- boostrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../global/global.css" />

  <!-- coloris-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.css" />

  <!-- animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
</head>

<body>
  <!-- header -->
  <div id="navbarContainer">
    <div class="row p-2" id="navbar" data-aos="fade-down" data-aos-delay="1000">
      <div class="col-12 col-md-5 d-flex align-items-center">
        <p>my website</p>
      </div>

      <div class="col-12 col-md-7 d-flex align-items-center justify-content-end">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item ml-auto">
              <a href="/">home</a>
            </li>
          </ol>
        </nav>
      </div>
    </div>
  </div>

  <!-- main page -->
  <div id="mainContentContainer" class="row justify-content-center align-items-center p-4" style="height: 1500px">
    <!-- actual main content goes here -->
    <div id="mainContent" class="col-12 col-md-10 d-flex justify-content-center flex-wrap">
      <div id="container" class="col-12 p-4 g-3" style="max-width: 1000px">
        <h2><u>title</u></h2>
        <h3>date</h3>

        <p>talk</p>

        <div class="accordion" id="accordionExample">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                Speaker Editing
              </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">

              <div class="container card accordion-body" id="speakerEditingHere">

                <!-- speaker functionality will go here -->
                <div class="row" style="min-height: 300px; max-height: 500px; overflow: scroll;">
                  <div id="speakerAddDelete" class="col" style="min-height: 100px; background-color:pink; overflow: stretch;">

                    <div id="submitSpeakerDiv" class="mb-3 bg-faded p-3 h-100">

                      <!-- submitting speaker -->
                      <form id="submitSpeakerForm" class="form-group">

                        <label for="speakerNameid">Name:</label>
                        <input type="text" id="speakerNameid" name="speakerName" class="form-control mb-2" required />

                        <label for="speakerColorId" class="mr-2">Color</label>
                        <input type="text" class="form-control mb-2" id="speakerColorId" name="speakerColor" value="#FF0000" required data-coloris />

                        <label for="speakerImageid">Default Image URL:</label>
                        <input type="url" id="speakerImageid" name="speakerImage" class="form-control mb-3" value="https://f2.toyhou.se/file/f2-toyhou-se/users/entomologist?12" required />

                        <button type="submit" class="btn btn-primary" >
                          Submit Speaker
                        </button>
                      </form>

                      <!-- updating speake r -->
                      <form id="updateSpeakerForm" class="form-group">

                        <label for="updateSpeakerNameid">Name:</label>
                        <input type="text" id="updateSpeakerNameid" name="speakerName" class="form-control mb-2" required />

                        <label for="updateSpeakerColorId">Color</label>
                        <input type="text" class="form-control mb-2" id="updateSpeakerColorId" name="speakerColor" value="#FF0000" required data-coloris />

                        <label for="updateSpeakerImageid">Default Image URL:</label>
                        <input type="url" id="updateSpeakerImageid" name="speakerImage" class="form-control mb-3" value="https://f2.toyhou.se/file/f2-toyhou-se/users/entomologist?12" required />

                        <button type="submit" class="btn btn-secondary">
                          Update Speaker
                        </button>
                      </form>

                    </div>

                  </div>
                  <div id="speakerList" class="col-12 col-sm-12 col-md-8 order-12 order-sm-12 order-md-6" style="min-height: 100px; background-color:red; overflow: scroll; "> </div>
                </div>

                <!-- speaker image functionality will go here (only show when a speaker is actually selected ?) -->
                <div id="imageControl" class="row" style="min-height: 300px;">
                  <div id="speakerImageAddDelete" class="col" style="min-height: 100px; background-color:blue">

                    <!-- submit -->
                    <div id="submitSpeakerImageDiv" class="mb-3 bg-faded p-3 h-100">
                      <form id="submitSpeakerImageForm" class="form-group">

  <label for="speakerImageNameid">Image name:</label>

  <input
    type="text"
    id="speakerImageNameid"
    name="speakerImageName"
    class="form-control mb-2"
    required
  />

  <label for="speakerImageLinkid">Image URL:</label>

  <input
    type="url"
    id="speakerImageLinkid"
    name="speakerImageLink"
    class="form-control mb-3"
    required
  />

  <button type="submit" class="btn btn-primary">
    Submit Image for Selected Speaker
  </button>

</form>
                    </div>

                  </div>
                  <div id="speakerImageList" class="col-12 col-sm-12 col-md-8 order-12 order-sm-12 order-md-6" style="min-height: 100px; background-color:cyan"> speaker images go here when submitted</div>
                </div>

              </div>

            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                Area Convo Editing
              </button>
            </h2>
            <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">

              <div class="container card accordion-body" id="areaConvoEditingHere">
                <div class="row " style="min-height: 300px;">
                  <div id="areaConvoAddDelete" class="col" style="min-height: 100px; background-color:pink">

                    <!-- submit -->
                    <div id="submitareaConvoDiv" class="mb-3 bg-faded p-3 h-100">
                      <form id="submitareaConvoForm" class="form-group">

                        <label for="areaConvoNameid">Name:</label>
                        <input type="text" id="areaConvoNameid" name="areaConvoName" class="form-control mb-2" required />

                        <label for="areaConvoImageid">Background Image URL:</label>
                        <input type="url" id="areaConvoImageid" name="areaConvoImage" class="form-control mb-3" value="https://f2.toyhou.se/file/f2-toyhou-se/users/entomologist?12" required />

                        <button type="submit" class="btn btn-primary" onClick="submitAreaConvo()">
                          Submit Area Convo
                        </button>
                      </form>
                    </div>

                  </div>
                  <div id="speakerList" class="col-12 col-sm-12 col-md-8 order-12 order-sm-12 order-md-6" style="min-height: 100px; background-color:red"> speakers go here when submitted</div>
                </div>
              </div>

            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                Accordion Item #3
              </button>
            </h2>
            <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">

              <div class="container card accordion-body" id="dialogueEditingHere">
                <div class="row " style="min-height: 300px;">
                  <div id="dialogueAddDelete" class="col" style="min-height: 100px; background-color:pink">

                    <!-- submit -->
                    <div id="submitdialogueDiv" class="mb-3 bg-faded p-3 h-100">
                      <form id="submitdialogueForm" class="form-group">

                        <!-- change to dropdowns for speakerList and speaker.images-->
                        <label for="dialogueNameid">Name:</label>
                        <input type="text" id="dialogueNameid" name="dialogueName" class="form-control mb-2" required />

                        <label for="dialogueImageid">Background Image URL:</label>
                        <input type="url" id="dialogueImageid" name="dialogueImage" class="form-control mb-3" value="https://f2.toyhou.se/file/f2-toyhou-se/users/entomologist?12" required />

                        <button type="submit" class="btn btn-primary" onClick="submitAreaConvo()">
                          Submit Dialogue
                        </button>
                      </form>
                    </div>

                  </div>
                  <div id="dialogueList" class="col-12 col-sm-12 col-md-8 order-12 order-sm-12 order-md-6" style="min-height: 100px; background-color:red"> dialogue go here when submitted</div>
                </div>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- footer -->
  <div id="footer" class="d-flex justify-content-center align-items-center p-4">
    <p>
      <a href="https://unsplash.com/photos/nature-christmas-concept-flat-lay-T86aoafcM38">
        image credit
      </a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

  <!-- animation -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

  <!-- coloris -->
  <script src="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.js"></script>

  <!-- sortable -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <!-- scrolling -->
  <script src="script.js"></script>
</body>

</html>
